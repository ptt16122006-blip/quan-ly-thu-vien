global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus tự giám sát chính nó
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Ứng dụng FastAPI Quản lý Thư viện qua endpoint /metrics
  - job_name: "fastapi_app"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:8000"]
        labels:
          app: "library-app"
          environment: "production"

  # 3. PostgreSQL Database Exporter (Giám sát CSDL, kết nối, transaction)
  - job_name: "postgres"
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          db: "library_db"
          environment: "production"
