worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream định tuyến đến FastAPI app container trong Docker network
    upstream fastapi_app {
        server app:8000;
        keepalive 32;
    }

    # Cấu hình máy chủ HTTP (Cổng 80)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost 127.0.0.1;

        # Chuyển hướng tự động từ HTTP sang HTTPS
        return 301 https://$host$request_uri;
    }

    # Cấu hình máy chủ HTTPS (Cổng 443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost 127.0.0.1;

        # Cấu hình chứng chỉ SSL
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ==============================================================================
        # CẤU HÌNH BẢO MẬT (SECURITY HEADERS)
        # ==============================================================================
        # 1. Chống MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # 2. Chống clickjacking (chỉ cho phép nhúng trong cùng domain)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 3. Kiểm soát thông tin Referrer khi chuyển hướng
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 4. Content-Security-Policy an toàn cho ứng dụng (cho phép style/script nội bộ, không làm hỏng giao diện)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

        # 5. X-XSS-Protection (tương thích các trình duyệt cũ)
        add_header X-XSS-Protection "1; mode=block" always;

        # Giới hạn kích thước body upload
        client_max_body_size 20M;

        # Định tuyến tất cả request đến FastAPI
        location / {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;

            # Proxy Headers tiêu chuẩn
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Hỗ trợ WebSocket / Keep-alive
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout cài đặt hợp lý
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Cache file tĩnh nếu cần thiết
        location /static/ {
            proxy_pass http://fastapi_app/static/;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
