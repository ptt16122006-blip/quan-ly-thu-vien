services:
  # Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Quản trị cơ sở dữ liệu qua giao diện Web pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: library_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@library.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_network

  # Ứng dụng chính FastAPI Quản lý thư viện
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: library_app
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres_password_123@postgres:5432/library_db}
      APP_NAME: ${APP_NAME:-Hệ Thống Quản Lý Thư Viện}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_library_management_2026}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_network

volumes:
  postgres_data:
    driver: local

networks:
  library_network:
    driver: bridge
