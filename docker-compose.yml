services:
  # Nginx Reverse Proxy (Tiếp nhận traffic HTTP/HTTPS chính)
  nginx:
    image: nginx:1.27-alpine
    container_name: library_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - library_network

  # Ứng dụng chính FastAPI Quản lý thư viện
  # Cổng 8000 KHÔNG công khai ra ngoài host - Nginx sẽ proxy vào app:8000
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: library_app
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://library_user:library_app_secure_pass_2026@postgres:5432/library_db}
      APP_NAME: ${APP_NAME:-Hệ Thống Quản Lý Thư Viện}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_library_management_2026}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_network

  # Cơ sở dữ liệu PostgreSQL
  # Cổng 5432 KHÔNG công khai ra ngoài host - các container kết nối nội bộ qua postgres:5432
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
      APP_DB_USER: ${APP_DB_USER:-library_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-library_app_secure_pass_2026}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Quản trị cơ sở dữ liệu qua giao diện Web pgAdmin (Service độc lập)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: library_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@library.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password_123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_network

volumes:
  # Volume lưu trữ dữ liệu PostgreSQL bền vững
  postgres_data:
    driver: local

networks:
  # Mạng bridge riêng kết nối bảo mật giữa các service
  library_network:
    driver: bridge
